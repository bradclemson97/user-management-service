server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework: INFO
    com.example.usermanagementservice: DEBUG

spring:
  application:
    name: user-management-service
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:user_management}
  flyway:
    enabled: true
    schemas: user_management
    placeholders:
      system-admin-username: ${SYSTEM_ADMIN_USERNAME:superuser@system.local}
      system-admin-firstname: ${SYSTEM_ADMIN_FIRSTNAME:Super}
      system-admin-lastname: ${SYSTEM_ADMIN_LASTNAME:User}
      system-admin-email: ${SYSTEM_ADMIN_EMAIL:superuser@system.local}
      system-admin-systemuser-id: ${SYSTEM_ADMIN_SYSTEMUSER_ID:a0000000-0000-0000-0000-000000000001}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/userdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/system}
  cloud:
    config:
      enabled: false

application:
  name: "@project.name"
  description: "@project.description@"
  version: "@project.version"
  slug: "@project.artifactId"
  env: ${ENVIRONMENT:local}

app:
  user:
    search:
      page:
        size: ${USER_SEARCH_PAGE_SIZE:25}

cache:
  expire-after: ${CACHE_EXPIRE_AFTER:60}
  expiry-units: ${CACHE_EXPIRY_UNITS:MINUTES}
  max: ${CACHE_MAX_SIZE:1000}

clients:
  clients:
    keycloak-manager:
      base-url: ${KEYCLOAK_MANAGER_URL:http://localhost:8210}
    acm:
      base-url: ${ACM_URL:http://localhost:8130}

access-control:
  security:
    manager-url: ${ACM_URL:http://localhost:8130}
    system-user-id-claim: systemUserId
    fail-on-error: false

springdoc:
  swagger-ui:
    path: /v1/docs
  api-docs:
    path: /v1/api-docs
